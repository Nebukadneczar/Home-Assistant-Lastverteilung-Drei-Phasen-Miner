# Version: 1.1.0
# Home Assistant – Lastverteilung Drei-Phasen-Miner
#
# Regelt einen Miner anhand der Gesamtlast seiner zugeordneten Phase.
# Ziel: maximal 9.000 W Phasenlast.
#
# Berechnung:
# Grundlast = Phasenleistung - aktuelles Miner-Power-Target
# verfügbar = Phasengrenzwert - Grundlast - Sicherheitsreserve
#
# v1.1.0 Änderungen:
# - mode: single statt restart (stabilere Ausführung)
# - max_exceeded: log statt silent (bessere Fehlersichtbarkeit)
# - Hysterese: Erhöhung erst wenn Phase deutlich unter Limit
# - Nur Trigger auf der Miner-Phase (keine unnötigen Ausführungen)
# - Konfigurierbare Hysterese-Schwelle

blueprint:
  name: "Miner – Lastverteilung Drei Phasen 9 kW"
  description: >
    Begrenzt die Gesamtlast der Phase, an der ein ausgewählter Miner hängt,
    auf maximal 9.000 W. Überwacht die Phasenlast, berechnet aus der
    Phasenlast und dem aktuellen Miner-Power-Target die zulässige Minerleistung
    und setzt das Power Target entsprechend. Prüfung standardmäßig alle
    5 Minuten sowie sofort bei einer Phasenlast über 9.000 W.
    Hysterese verhindert Flattern bei schwankenden Lasten.
  domain: automation
  source_url: "https://github.com/Nebukadneczar/Home-Assistant-Lastverteilung-Drei-Phasen-Miner"
  input:

    phase_a_sensor:
      name: Phase A – Leistung
      description: Sensor mit der aktuellen Leistung von Phase A in Watt.
      selector:
        entity:
          domain: sensor
          device_class: power

    phase_b_sensor:
      name: Phase B – Leistung
      description: Sensor mit der aktuellen Leistung von Phase B in Watt.
      selector:
        entity:
          domain: sensor
          device_class: power

    phase_c_sensor:
      name: Phase C – Leistung
      description: Sensor mit der aktuellen Leistung von Phase C in Watt.
      selector:
        entity:
          domain: sensor
          device_class: power

    miner_phase:
      name: Miner-Phase
      description: Phase, an der der zu regelnde Miner angeschlossen ist.
      default: B
      selector:
        select:
          options:
            - A
            - B
            - C

    miner_power_target:
      name: Miner Power Target
      description: number.* Entity, über die das Leistungsziel des Miners gesetzt wird.
      selector:
        entity:
          domain: number

    max_miner_power:
      name: Maximale Minerleistung
      description: Obergrenze für das Power Target des Miners.
      default: 2832
      selector:
        number:
          min: 0
          max: 15000
          step: 1
          mode: box
          unit_of_measurement: W

    phase_limit:
      name: Phasengrenzwert
      description: Maximale zulässige Leistung der überwachten Phase.
      default: 9000
      selector:
        number:
          min: 1000
          max: 20000
          step: 100
          mode: box
          unit_of_measurement: W

    safety_margin:
      name: Sicherheitsreserve
      description: Reserve unterhalb des Phasengrenzwertes.
      default: 100
      selector:
        number:
          min: 0
          max: 2000
          step: 50
          mode: box
          unit_of_measurement: W

    change_step:
      name: Änderungsstufe
      description: Power Target wird auf diese Schrittweite gerundet.
      default: 100
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box
          unit_of_measurement: W

    hysterese_threshold:
      name: Hysterese-Schwelle
      description: >
        Miner wird erst wieder erhöht, wenn die Phasenlast unter
        (Phasengrenzwert - Sicherheitsreserve - Hysterese) fällt.
        Verhindert Flattern bei schwankenden Lasten.
      default: 500
      selector:
        number:
          min: 0
          max: 3000
          step: 100
          mode: box
          unit_of_measurement: W

    evaluation_interval:
      name: Prüfintervall
      description: Zeit zwischen normalen Prüfungen.
      default: "/5"
      selector:
        select:
          options:
            - label: "1 Minute"
              value: "/1"
            - label: "5 Minuten"
              value: "/5"
            - label: "10 Minuten"
              value: "/10"
            - label: "15 Minuten"
              value: "/15"

    notification_id:
      name: Benachrichtigungs-ID
      description: ID für die persistente Home-Assistant-Benachrichtigung.
      default: "miner_lastverteilung_drei_phasen"
      selector:
        text:

mode: single
max_exceeded: log

trigger:
  - platform: time_pattern
    minutes: !input evaluation_interval
    id: zyklus

  # Nur Trigger auf der Phase, an der der Miner hängt
  - platform: state
    entity_id: >-
      {% if miner_phase == 'A' %}
        {{ phase_a_sensor }}
      {% elif miner_phase == 'B' %}
        {{ phase_b_sensor }}
      {% else %}
        {{ phase_c_sensor }}
      {% endif %}
    id: miner_phase_aenderung

condition: []

action:
  - variables:
      phase_a: !input phase_a_sensor
      phase_b: !input phase_b_sensor
      phase_c: !input phase_c_sensor
      selected_phase: !input miner_phase
      target_entity: !input miner_power_target
      configured_max: !input max_miner_power
      configured_limit: !input phase_limit
      configured_margin: !input safety_margin
      configured_step: !input change_step
      configured_hysteresis: !input hysterese_threshold

      # Aktuelle Phasenleistung der Miner-Phase
      phase_power: >-
        {% if selected_phase == 'A' %}
          {{ states(phase_a) | float(0) }}
        {% elif selected_phase == 'B' %}
          {{ states(phase_b) | float(0) }}
        {% else %}
          {{ states(phase_c) | float(0) }}
        {% endif %}

      # Aktuelles Miner-Power-Target
      current_target: "{{ states(target_entity) | float(0) }}"

      # Grundlast = Phasenleistung - Miner-Target
      base_load: >-
        {{ [phase_power - current_target, 0] | max }}

      # Verfügbare Leistung für den Miner
      available_power_raw: >-
        {{ configured_limit - base_load - configured_margin }}

      # Begrenzt auf maximale Minerleistung
      available_power: >-
        {{ [available_power_raw, configured_max] | min | max(0) }}

      # Auf Änderungsstufe gerundet
      rounded_power: >-
        {{ ((available_power / configured_step) | round(0, 'floor')) * configured_step }}

      # Neues Ziel, begrenzt auf Max
      new_target: >-
        {{ [rounded_power, configured_max] | min | max(0) | int }}

      # Hysterese: Miner wird erst erhöht, wenn Phase deutlich unter Limit
      hysteresis_limit: >-
        {{ configured_limit - configured_margin - configured_hysteresis }}

      # Soll der Miner erhöht werden dürfen?
      can_increase: >-
        {% if phase_power < hysteresis_limit %}true{% else %}false{% endif %}

      # Über dem Grenzwert?
      over_limit: "{{ phase_power > configured_limit }}"

      # Unterschied zwischen neuem und aktuellem Target
      target_difference: >-
        {{ (new_target - current_target) | abs }}

  # Sofortreaktion: Phase über Grenzwert
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ over_limit }}"
        sequence:
          - service: number.set_value
            target:
              entity_id: !input miner_power_target
            data:
              value: "{{ new_target }}"

          - service: persistent_notification.create
            data:
              notification_id: !input notification_id
              title: "⚠️ Drei-Phasen-Lastverteilung"
              message: >-
                Phase {{ selected_phase }} ÜBER dem Grenzwert:
                {{ phase_power | round(0) }} W.
                Miner-Ziel auf {{ new_target }} W gesetzt.

      # Normale Anpassung: Unterschied >= Änderungsstufe
      # UND Hysterese erlaubt Erhöhung
      - conditions:
          - condition: template
            value_template: "{{ target_difference >= configured_step }}"
          - condition: template
            value_template: >-
              {% if new_target > current_target %}
                {{ can_increase }}
              {% else %}
                true
              {% endif %}
        sequence:
          - service: number.set_value
            target:
              entity_id: !input miner_power_target
            data:
              value: "{{ new_target }}"

          - service: persistent_notification.create
            data:
              notification_id: !input notification_id
              title: "🔄 Drei-Phasen-Lastverteilung"
              message: >-
                Phase {{ selected_phase }}:
                {{ phase_power | round(0) }} W Gesamtlast.
                Miner-Ziel: {{ current_target | round(0) }} W →
                {{ new_target }} W.

      # Warnung: Phase nähert sich dem Grenzwert
      - conditions:
          - condition: template
            value_template: "{{ phase_power | float(0) >= configured_limit - configured_margin }}"
        sequence:
          - service: persistent_notification.create
            data:
              notification_id: !input notification_id
              title: "⚡ Drei-Phasen-Lastverteilung"
              message: >-
                Phase {{ selected_phase }} nähert sich dem Grenzwert:
                {{ phase_power | round(0) }} W von {{ configured_limit | round(0) }} W.

    default: []
